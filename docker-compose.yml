version: '3.8'
services:
  backend:
    build: .
    command: npm start
    volumes:
      - ./:/usr/src/app
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taskpulse
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_QUEUE=task_queue
    depends_on:
      - postgres
      - redis
      - rabbitmq

  worker:
    build: .
    command: node src/workers/task.worker.js
    volumes:
      - ./:/usr/src/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taskpulse
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_QUEUE=task_queue
    depends_on:
      - backend
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: taskpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./src/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./src/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./src/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - '3001:3000'

volumes:
  pgdata:
